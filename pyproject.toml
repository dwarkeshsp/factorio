[project]
name = "factoriobench"
version = "0.3.1"
description = "Language models play Factorio through the screen, mouse and keyboard, scored by the game's own statistics"
readme = "README.md"
authors = [{ name = "Dwarkesh Patel" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10",  # Claude conversations and the computer-use toolset
    "mss>=10",          # screen capture from the X display
    "pillow>=11",       # screenshot cropping and encoding
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3.2"]

[project.scripts]
factoriobench = "factoriobench.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factoriobench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
